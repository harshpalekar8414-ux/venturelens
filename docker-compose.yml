services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: venturelens_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: venturelens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d venturelens"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: venturelens_postgres_data
